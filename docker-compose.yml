services:
  postgres:
    image: postgres:16-alpine
    container_name: volunteer_db
    environment:
      POSTGRES_DB: volunteer_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
